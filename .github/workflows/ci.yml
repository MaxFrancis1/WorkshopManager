name: CI

# Runs on every pull request: typecheck, build, and the database tests that
# apply every migration to an in-memory Postgres. Make "checks" a required
# status check on main so a broken migration cannot be merged (and deployed).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build
        env:
          # Placeholder values: the build only needs them to exist.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      - name: Database tests
        run: npm run test:db
