<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mobile add service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1E5B43}a:hover{color:#123A2B}
</style>

<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #7C807A; font-family: Inter, system-ui, sans-serif; color: #15171A; display: flex; flex-direction: column; justify-content: flex-end">
  <section aria-label="Add service" style="background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 40px; height: 5px; border-radius: 999px; background: #D5D8D2; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">Add service</h1>
        <span style="font-size: 13px; color: #5B6168"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #15171A">K7</span> · Srixon P–5 irons</span>
      </div>
      <a href="M-Item.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 600; color: #3F454B; padding: 0 0 8px">Service</legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #1E5B43; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">Regrip</button>
        <button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2E4DF; background: #FFFFFF; font: inherit; font-size: 14px">Reshaft</button>
        <button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2E4DF; background: #FFFFFF; font: inherit; font-size: 14px">Groove sharpen</button>
        <button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2E4DF; background: #FFFFFF; font: inherit; font-size: 14px">Clean</button>
        <button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2E4DF; background: #FFFFFF; font: inherit; font-size: 14px">Paint-fill</button>
      </div>
    </fieldset>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 600">Quantity</span>
      <div style="display: flex; align-items: center; border: 1px solid #E2E4DF; border-radius: 12px">
        <button aria-label="Decrease quantity" style="width: 48px; height: 48px; border: 0; background: transparent; font: inherit; font-size: 22px; color: #15171A">−</button>
        <span style="width: 40px; text-align: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; font-weight: 700">5</span>
        <button aria-label="Increase quantity" style="width: 48px; height: 48px; border: 0; background: transparent; font: inherit; font-size: 22px; color: #15171A">+</button>
      </div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0">
      <legend style="font-size: 13px; font-weight: 600; color: #3F454B; padding: 0 0 8px">Grip</legend>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; border: 2px solid #1E5B43; border-radius: 12px; background: #F2F8F4">
        <input type="radio" name="grip" checked style="width: 20px; height: 20px; accent-color: #1E5B43">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Golf Pride MCC Std</span><span style="font-size: 12px; color: #5B6168">14 in stock</span></span>
        <span style="font-size: 14px; font-weight: 600">£8.50</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; margin-top: 8px; border: 1px solid #E2E4DF; border-radius: 12px">
        <input type="radio" name="grip" style="width: 20px; height: 20px; accent-color: #1E5B43">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Golf Pride Tour Velvet</span><span style="font-size: 12px; color: #5B6168">22 in stock</span></span>
        <span style="font-size: 14px; font-weight: 600">£6.80</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; margin-top: 8px; border: 1px solid #E2E4DF; border-radius: 12px">
        <input type="radio" name="grip" style="width: 20px; height: 20px; accent-color: #1E5B43">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Lamkin Crossline</span><span style="font-size: 12px; color: #9A4A0B; font-weight: 600">3 in stock · not enough</span></span>
        <span style="font-size: 14px; font-weight: 600">£6.20</span>
      </label>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">
      <div style="display: flex; justify-content: space-between"><span style="color: #3F454B">Tape · 5 × £0.50</span><span>£2.50</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #3F454B">Grips · 5 × £8.50</span><span>£42.50</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <label for="svc-time" style="color: #3F454B">Time (5 × 30 min)</label>
        <input id="svc-time" value="2 h 30 m" style="width: 96px; height: 40px; box-sizing: border-box; text-align: right; border: 1px solid #E2E4DF; border-radius: 10px; padding: 0 10px; font: inherit; font-size: 14px">
      </div>
      <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #EEF0EC; font-weight: 700; font-size: 16px"><span>Parts cost</span><span>£45.00</span></div>
    </div>

    <a href="M-Item.dc.html" style="min-height: 54px; border-radius: 14px; background: #1E5B43; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Add 5 × Regrip</a>
  </section>
</div>


</body>
</html>
